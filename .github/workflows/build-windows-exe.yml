name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --noconfirm screensaverspecial.spec

      - name: Prepare artifact folder
        run: |
          mkdir artifact
          copy dist\ScreenSaverSpecial.exe artifact\ScreenSaverSpecial.exe
          copy config.json artifact\config.json
          copy config.example.json artifact\config.example.json

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSaverSpecial-windows-package
          path: artifact/
